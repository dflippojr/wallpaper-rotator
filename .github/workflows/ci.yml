name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No concurrency block on purpose: every run on main must finish, so `gate` has
# a result for every main commit. If one is ever added, it must never cancel
# main runs:
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Minimum line coverage (percent) for `cargo llvm-cov --workspace` on Linux.
  # Set to the measured total minus 1 point (79.66% on 2026-10-18). The floor
  # only goes up: raise it when coverage rises, never lower it to get a PR
  # through.
  # scripts/check.sh reads this value.
  COVERAGE_FLOOR: 78.6

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --summary-only
          total=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.percent')
          printf '### Coverage\n\nLine coverage: **%.2f%%** (floor %s%%)\n' "$total" "$COVERAGE_FLOOR" >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR" > /dev/null

  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint the shell scripts
        run: shellcheck -S warning install.sh scripts/build-release.sh
      - name: Dry-run install.sh
        env:
          XDG_CURRENT_DESKTOP: ubuntu:GNOME
          DISPLAY: ":0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --dry-run
          bash install.sh --uninstall --purge --dry-run

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dry-run install.ps1 in Windows PowerShell 5.1
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          .\install.ps1 -DryRun
          .\install.ps1 -Uninstall -Purge -DryRun

  # The one check a ruleset requires. It always runs and fails unless every
  # other job succeeded (a failed, cancelled or skipped job fails the gate).
  gate:
    if: always()
    needs: [test, installers, installer-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
