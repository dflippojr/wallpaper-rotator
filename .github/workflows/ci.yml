name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gate-guard reads the pull request's labels and the owner's label events.
  # A called workflow can't hold more than its caller, so both are granted here.
  issues: read
  pull-requests: read

# No concurrency block on purpose: every run on main must finish, so `gate` has
# a result for every main commit. If one is ever added, it must never cancel
# main runs:
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Minimum line coverage (percent) for `cargo llvm-cov --workspace` on Linux.
  # Set to the measured total minus 1 point (81.04% on 2026-10-18). The floor
  # only goes up: raise it when coverage rises, never lower it to get a PR
  # through.
  # scripts/check.sh reads this value.
  COVERAGE_FLOOR: 80.1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --summary-only
          total=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.percent')
          printf '### Coverage\n\nLine coverage: **%.2f%%** (floor %s%%)\n' "$total" "$COVERAGE_FLOOR" >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR" > /dev/null

  # Sets the wallpaper with the app's own setter on a real desktop and reads
  # it back from the OS, then checks a screenshot of the desktop
  # (crates/core/tests/os_wallpaper.rs). GNOME runs headless under
  # scripts/os-wallpaper-gnome.sh. The coverage of the platform setters goes
  # to the job summary; the floor above is measured by `test` only.
  os-wallpaper:
    name: os-wallpaper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ROTATOR_OS_TESTS: "1"
      ROTATOR_OS_TESTS_SCREENSHOT: "1"
      ROTATOR_OS_TESTS_OUT: ${{ github.workspace }}/os-wallpaper-out
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Install GNOME Shell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gsettings-desktop-schemas dconf-gsettings-backend dconf-service
      - name: Set and read back the wallpaper
        shell: bash
        run: |
          run=(cargo llvm-cov -p rotator-core --test os_wallpaper --no-report)
          if [ "$RUNNER_OS" = Linux ]; then
            scripts/os-wallpaper-gnome.sh "${run[@]}"
          else
            "${run[@]}"
          fi
      - name: Coverage of the platform setters
        shell: bash
        run: |
          cargo llvm-cov report --summary-only | grep -E '^(Filename|TOTAL)|wallpaper[/\]' | tee coverage.txt
          { printf '### Coverage from the OS wallpaper tests\n\n```\n'; cat coverage.txt; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-wallpaper-${{ matrix.os }}
          path: os-wallpaper-out
          if-no-files-found: ignore

  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint the shell scripts
        run: shellcheck -S warning install.sh scripts/build-release.sh scripts/prepare-bundle-cli.sh scripts/smoke-installed.sh scripts/test-release-smoke.sh
      - name: Release smoke regression checks
        run: bash scripts/test-release-smoke.sh
      - name: Dry-run install.sh
        env:
          XDG_CURRENT_DESKTOP: ubuntu:GNOME
          DISPLAY: ":0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --dry-run
          bash install.sh --uninstall --purge --dry-run

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dry-run install.ps1 in Windows PowerShell 5.1
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\smoke-installed.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          .\install.ps1 -DryRun
          .\install.ps1 -Uninstall -Purge -DryRun

  # The shared gate guard (dflippojr/.github), pinned by full SHA: fails a pull
  # request that deletes tests, adds #[ignore], adds retries, or edits
  # workflows or coverage config, unless the owner applied gate-change-approved.
  # guard-ref names the same SHA, so the script that judges the pull request is
  # the one that was reviewed. It checks pull requests only (a push prints a
  # notice). Labels are read when the job runs: after the owner applies one,
  # re-run this job.
  # This job is an early signal inside gate, not the judge: it runs from the
  # pull request's head, so a pull request can replace it, and it accepts a
  # label applied before the newest push. The trusted copy is
  # gate-guard-target.yml, which runs from main and posts the gate-guard check
  # the ruleset requires.
  gate-guard:
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@e2c7fae8508be0359f3abaf136caade46ee7479c
    with:
      guard-ref: e2c7fae8508be0359f3abaf136caade46ee7479c
      require-owner-label-actor: true

  # The check a ruleset requires, with gate-guard from gate-guard-target.yml.
  # It always runs and fails unless every other job succeeded (a failed,
  # cancelled or skipped job fails the gate).
  gate:
    if: always()
    needs: [test, os-wallpaper, installers, installer-windows, gate-guard]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
