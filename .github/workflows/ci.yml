name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint the shell scripts
        run: shellcheck -S warning install.sh scripts/build-release.sh
      - name: Dry-run install.sh
        env:
          XDG_CURRENT_DESKTOP: ubuntu:GNOME
          DISPLAY: ":0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --dry-run
          bash install.sh --uninstall --purge --dry-run

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dry-run install.ps1 in Windows PowerShell 5.1
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          .\install.ps1 -DryRun
          .\install.ps1 -Uninstall -Purge -DryRun
