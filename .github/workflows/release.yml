name: Release

# Push a tag like v0.3.0 (matching the version in app/tauri.conf.json) to
# build every installer and publish them as a GitHub release. The release
# stays a draft until all builds have uploaded, so install.sh and
# install.ps1 never see a half-finished one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' app/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in app/tauri.conf.json"
            exit 1
          fi
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: create
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 so the packages run on Ubuntu 22.04 and later
          # (glibc 2.35, what install.sh expects).
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: ubuntu-22.04-arm
            bundles: deb
          # One app for Apple silicon and Intel Macs.
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Build the installers
        working-directory: app
        shell: bash
        env:
          # The AppImage tooling is itself an AppImage; no FUSE needed this way.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TARGET: ${{ matrix.target }}
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} ${TARGET:+--target "$TARGET"}
      - name: Upload them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          # target/release/bundle, or target/<triple>/release/bundle.
          find target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          # Dashes instead of spaces, as install.sh and install.ps1 expect.
          for f in dist/*\ *; do [ -e "$f" ] && mv "$f" "${f// /-}"; done
          ls -l dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
