name: Automated Code Review

# Thin caller for the shared review-v3 workflow in dflippojr/agent-harness, so fixes to the reviewer reach this
# repository without a copy. The workflow and its tooling (tooling_ref) are both pinned to the review-v3 tag.
#
# Reviews a PR once when it is opened. After later commits, dispatch a re-review:
#   gh workflow run review.yml -f pr_number=<PR> -f mode=full
#
# Never pull_request: the reviewer reads untrusted PR content with shell access on the self-hosted runner, and a
# fork's pull_request run would execute the fork's copy of this file. pull_request_target uses the base copy, and the
# owner-installed job-started hook permits only this file on main for either event. The job guard below skips fork
# PRs and Dependabot, and the shared job refuses forks too. The PR head is checked out only as review context; nothing
# from it runs. Keep fork approval for all external contributors.
# No secrets are passed: the shared workflow needs only the GITHUB_TOKEN, narrowed by the permissions below.
on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      backend:
        description: "Review backend (auto uses REVIEW_BACKENDS)"
        required: false
        default: auto
        type: choice
        options: [auto, cursor, codex, claude]
      mode:
        description: "Review coverage (auto = incremental when safe)"
        required: false
        default: auto
        type: choice
        options: [auto, full]

permissions:
  contents: read
  pull-requests: write
  checks: write
  # review-v3 reads the issues the pull request closes, the spec it reviews against. A called workflow can't hold
  # more than its caller grants.
  issues: read

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    uses: dflippojr/agent-harness/.github/workflows/review.yml@review-v3
    with:
      pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
      backend: ${{ inputs.backend || 'auto' }}
      mode: ${{ inputs.mode || 'full' }}
      # The owner's review runner for this repository. It is not a GitHub-hosted runner.
      runs_on: '["self-hosted","Windows","X64","wallpaper-rotator-review"]'
      tooling_ref: review-v3
