[package]
name = "rotator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unsplash wallpaper rotation with a bounded cache"

[lib]
name = "rotator_core"

[[bin]]
name = "wallpaper-rotator-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Changes the real desktop, so it skips itself unless ROTATOR_OS_TESTS=1.
# No libtest harness: macOS wallpaper calls must run on the main thread.
[[test]]
name = "os_wallpaper"
harness = false
