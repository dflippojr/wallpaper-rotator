[package]
name = "wallpaper-rotator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tray app that rotates Unsplash wallpapers without filling your disk"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
rotator-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
