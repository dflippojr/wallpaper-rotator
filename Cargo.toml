[workspace]
resolver = "2"
members = ["crates/core", "app"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Faster local builds (install.sh --from-source on Linux): no link-time
# optimization, parallel codegen. Larger binary, much shorter build.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
